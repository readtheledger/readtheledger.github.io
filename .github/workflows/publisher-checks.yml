name: Check static publisher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/cloudflare/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/publisher-checks.yml'

permissions:
  contents: read

jobs:
  test-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test archive, provenance and deployment protections
        run: python3 -m unittest discover -s .github/cloudflare -p test_publish.py -v
