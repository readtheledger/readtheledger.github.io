name: Deploy to GitHub Pages

# The app is a folder of static files plus one build step: build.mjs writes a
# page for every Ledger story and section (the app, with that page's content in
# it), the sitemap, robots.txt and a real 404, into _site. The README and the
# test suites stay behind, as the README says. The build itself fails if any
# file a page references is missing from the output.

on:
  push:
    branches: [main]
  # the Newsstand is gathered every half hour — a target, not a promise: GitHub
  # may delay or drop scheduled runs under load, which is why the app shows the
  # time the Newsstand was actually gathered, and why this can be run by hand
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement: true switches Pages on the first time this runs, so the site
      # does not have to be turned on by hand in the repository settings
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # every public feed, gathered into one file; a feed that does not answer
      # keeps its items from the edition that is live now, marked stale. This
      # runs before the wait below on purpose: while the Pages source is still
      # the built-in build, that build replaces the live site — without the
      # gathered file — the moment it finishes, so the previous edition has to
      # be read before then. If the gatherer itself fails the site still
      # deploys, and the app gathers in the browser as it used to.
      - name: Gather the Newsstand
        continue-on-error: true
        run: node fetch_feeds.mjs

      # A repository named <owner>.github.io gets Pages switched on by GitHub
      # itself, publishing the branch through its built-in build — so until the
      # source is changed (Settings → Pages → Source → GitHub Actions; the job's
      # token is not allowed to change it), every push is published twice and
      # the last build to finish wins. So this job reads the Pages source, and
      # while it is still the built-in build, waits for that build of this very
      # commit to finish before deploying — which makes the pages this workflow
      # built the ones that are live. Once the source is GitHub Actions there is
      # nothing to wait for and the step is a few hundred milliseconds.
      - name: Deploy after the built-in build, so this build is the one that is live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          source=$(curl -sS "${hdr[@]}" "$api" | sed -n 's/.*"build_type": *"\([a-z]*\)".*/\1/p')
          echo "Pages source: ${source:-unknown}"
          if [ "$source" = "workflow" ]; then
            echo "This workflow is the only publishing path; nothing to wait for."
            exit 0
          fi
          echo "::warning::Pages source is '${source:-unknown}', so GitHub's built-in build also publishes every push. Waiting for its build of ${{ github.sha }} so this deploy lands last. Set Settings → Pages → Source to GitHub Actions to retire it."
          for i in $(seq 1 36); do
            latest=$(curl -sS -w '\n%{http_code}' "${hdr[@]}" "$api/builds/latest")
            code=$(echo "$latest" | tail -1)
            if [ "$code" != "200" ]; then
              echo "builds API answered HTTP $code; waiting 90 s instead"
              sleep 90; exit 0
            fi
            commit=$(echo "$latest" | sed -n 's/.*"commit": *"\([0-9a-f]*\)".*/\1/p')
            status=$(echo "$latest" | sed -n 's/.*"status": *"\([a-z_]*\)".*/\1/p')
            echo "built-in build: commit ${commit:0:7} status ${status:-unknown}"
            if [ "$commit" = "${{ github.sha }}" ] && [ "$status" != "building" ] && [ "$status" != "queued" ]; then
              echo "built-in build of this commit has finished (${status}); deploying now so this build is live."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::gave up waiting for the built-in build after 3 minutes; deploying anyway"

      - name: Build the site
        run: |
          node --version
          node build.mjs _site
          find _site -type f | sort

      # belt and braces after the build's own reference check: the files the
      # installed app precaches, and the pages this release exists to publish,
      # must be in the artifact. The same script runs inside qa_pages.py, so
      # what the deploy relies on is what the tests exercise.
      - name: Check the artifact is complete
        run: sh check_site.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
