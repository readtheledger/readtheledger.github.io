name: Deploy to GitHub Pages

# The app is a folder of static files, so there is nothing to build — this only
# picks out the files that belong on the web (the README and the test suites stay
# behind, as the README says) and hands them to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement: true switches Pages on the first time this runs, so the site
      # does not have to be turned on by hand in the repository settings
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html content.js sw.js manifest.webmanifest _site/
          cp icon-180.png icon-192.png icon-512.png icon-maskable-512.png _site/
          touch _site/.nojekyll
          ls -la _site

      # every file the app itself asks for must actually be in the artifact —
      # a missing one (content.js, an icon) fails the deploy here, not in the field
      - name: Check nothing the app references is missing
        run: |
          missing=0
          refs="sw.js
          $(grep -oE '(src|href)="[^"]+"' index.html | cut -d'"' -f2 | grep -v '^http' | grep -v '[${]')
          $(grep -oE '"\./[^"]+"' sw.js | tr -d '"' | sed 's|^\./||')
          $(grep -oE '"src": *"[^"]+"' manifest.webmanifest | cut -d'"' -f4)"
          for f in $refs; do
            case "$f" in ""|*/) continue;; esac
            if [ ! -f "_site/$f" ]; then echo "MISSING from _site: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
