name: Deploy to GitHub Pages

# The app is a folder of static files plus one build step: build.mjs writes a
# page for every Ledger story and section (the app, with that page's content in
# it), the sitemap, robots.txt and a real 404, into _site. The README and the
# test suites stay behind, as the README says. The build itself fails if any
# file a page references is missing from the output.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement: true switches Pages on the first time this runs, so the site
      # does not have to be turned on by hand in the repository settings
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build the site
        run: |
          node --version
          node build.mjs _site
          find _site -type f | sort

      # belt and braces after the build's own reference check: the files the
      # installed app precaches, and the pages this release exists to publish,
      # must be in the artifact
      - name: Check the artifact is complete
        run: |
          missing=0
          for f in index.html content.js sw.js manifest.webmanifest icon-180.png icon-192.png icon-512.png icon-maskable-512.png sitemap.xml robots.txt 404.html .nojekyll; do
            [ -f "_site/$f" ] || { echo "MISSING from _site: $f"; missing=1; }
          done
          stories=$(find _site/story -name index.html | wc -l)
          echo "story pages: $stories"
          [ "$stories" -ge 1 ] || { echo "no story pages were generated"; missing=1; }
          grep -q 'ledger-shell-v[0-9]*-[0-9a-f]\{8\}' _site/sw.js || { echo "sw.js was not stamped by the build"; missing=1; }
          [ "$missing" -eq 0 ]

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
