<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Attention is the beginning of the customer journey</title>
  <desc id="desc">Three labelled steps: Seen, First visit, Return visit, connected by arrows.</desc>
  <rect width="1200" height="675" fill="#f7f0e4"/>
  <rect x="42" y="42" width="1116" height="591" rx="24" fill="#fffaf2" stroke="#d8cbb9" stroke-width="3"/>
  <text x="82" y="120" fill="#17130f" font-family="Georgia,serif" font-size="42" font-weight="700">Attention is the beginning</text>
  <text x="82" y="162" fill="#5c5146" font-family="Arial,sans-serif" font-size="23">A customer journey still has to continue after people notice.</text>
  <g font-family="Arial,sans-serif">
    <rect x="82" y="244" width="270" height="230" rx="18" fill="#1d3b4a"/>
    <circle cx="217" cy="304" r="34" fill="#e8a05b"/>
    <path d="M203 304h28M217 290v28" stroke="#1d3b4a" stroke-width="7" stroke-linecap="round"/>
    <text x="217" y="386" text-anchor="middle" fill="#fffaf2" font-size="31" font-weight="700">Seen</text>
    <text x="217" y="422" text-anchor="middle" fill="#dce8eb" font-size="20">someone notices</text>
    <path d="M385 359h82" stroke="#bd5b3e" stroke-width="8" stroke-linecap="round"/><path d="m450 339 24 20-24 20" fill="none" stroke="#bd5b3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="465" y="244" width="270" height="230" rx="18" fill="#bd5b3e"/>
    <circle cx="600" cy="304" r="34" fill="#f5cf8b"/>
    <path d="M579 307h42M588 293h24M588 321h24" stroke="#bd5b3e" stroke-width="6" stroke-linecap="round"/>
    <text x="600" y="386" text-anchor="middle" fill="#fffaf2" font-size="31" font-weight="700">First visit</text>
    <text x="600" y="422" text-anchor="middle" fill="#fff0e8" font-size="20">someone tries it</text>
    <path d="M768 359h82" stroke="#bd5b3e" stroke-width="8" stroke-linecap="round"/><path d="m833 339 24 20-24 20" fill="none" stroke="#bd5b3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="848" y="244" width="270" height="230" rx="18" fill="#e8a05b"/>
    <circle cx="983" cy="304" r="34" fill="#fffaf2"/>
    <path d="M966 304a18 18 0 1 0 6-13" fill="none" stroke="#e8a05b" stroke-width="7" stroke-linecap="round"/><path d="m970 287-2 18 17-8" fill="#e8a05b"/>
    <text x="983" y="386" text-anchor="middle" fill="#17130f" font-size="31" font-weight="700">Return visit</text>
    <text x="983" y="422" text-anchor="middle" fill="#3f3328" font-size="20">someone comes back</text>
  </g>
  <text x="82" y="570" fill="#5c5146" font-family="Arial,sans-serif" font-size="20">Illustration: attention is the beginning of the customer journey.</text>
</svg>
